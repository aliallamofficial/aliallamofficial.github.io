<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>على حاتم علام | باحث تقني</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }

        h1 { font-size: 1.5rem; color: #333; margin-bottom: 5px; }
        .handle { color: #007bff; font-weight: bold; margin-bottom: 20px; display: block; }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        /* زر المقالات المميز */
        .btn-articles {
            background: #2d3436;
            color: white;
            border: none;
        }

        .btn-articles:hover {
            background: #000;
            transform: translateY(-2px);
        }

        .btn-portfolio {
            background: #007bff;
            color: white;
        }

        .btn-portfolio:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://avatars.hsoubcdn.com/5ada6445dd1af161d0d75108289ad7b1?s=256" alt="علي حاتم علام" class="profile-img">
        <h1>على حاتم علام</h1>
        <span class="handle">@aliallamofficial</span>

        <div class="btn-container">
            <!-- زر الانتقال للمقالات -->
            <a href="https://aliallamofficial.github.io/critical-thinking.html" class="btn btn-articles">
                <svg class="icon" viewBox="0 0 24 24"><path d="M19,5V19H5V5H19M19,3H5C3.9,3 3,3.9 3,5V19C3,20.1 3.9,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.9 20.1,3 19,3M14,17H7V15H14V17M17,13H7V11H17V13M17,9H7V7H17V9Z"/></svg>
                تصفح المقالات التقنية
            </a>

            <!-- زر معرض الأعمال -->
            <a href="https://sites.google.com/view/aliallamofficial" class="btn btn-portfolio">
                معرض الأعمال والخدمات
            </a>
        </div>
    </div>

</body>
</html>
